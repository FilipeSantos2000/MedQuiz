<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="MedQuiz - treino de perguntas para a Prova Nacional de Acesso">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MedQuiz">
    <title>MedQuiz - Treino PNA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
    <header class="header" id="appHeader" style="display:none">
        <h1 class="brand">MedQuiz</h1>
        <div class="header-right">
            <button class="btn-icon" id="themeToggle" title="Alternar tema" aria-label="Alternar tema">
                <span id="themeIcon">🌙</span>
            </button>
            <span class="header-user" id="userName"></span>
            <button class="btn btn-secondary btn-sm" onclick="Auth.logout()">Sair</button>
        </div>
    </header>

    <nav class="nav" id="mainNav" style="display:none">
        <a href="#" data-page="quiz" class="nav-link active"><span class="nav-icon" aria-hidden="true">📝</span><span>Novo teste</span></a>
        <a href="#" data-page="history" class="nav-link"><span class="nav-icon" aria-hidden="true">📊</span><span>Histórico</span></a>
    </nav>

    <main class="main" id="mainContent"></main>

    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/store.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/history.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
        }
    </script>
</body>
</html>
