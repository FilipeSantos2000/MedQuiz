<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MedQuiz - treino de perguntas para a Prova Nacional de Acesso">
    <meta name="theme-color" content="#6366f1">
    <title>MedQuiz - Treino PNA</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
    <header class="header" id="appHeader" style="display:none">
        <h1 class="brand">MedQuiz</h1>
        <div class="header-right">
            <button class="btn-icon" id="themeToggle" title="Alternar tema" aria-label="Alternar tema">
                <span id="themeIcon">🌙</span>
            </button>
            <span class="header-user" id="userName"></span>
            <button class="btn btn-secondary btn-sm" onclick="Auth.logout()">Sair</button>
        </div>
    </header>

    <nav class="nav" id="mainNav" style="display:none">
        <a href="#" data-page="quiz" class="nav-link active">📝 Novo teste</a>
        <a href="#" data-page="history" class="nav-link">📊 Histórico</a>
    </nav>

    <main class="main" id="mainContent"></main>

    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/store.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/history.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
